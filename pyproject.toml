
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-3d-vae"
version = "0.1.0"
description = "Machine learning experimentation workspace"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
