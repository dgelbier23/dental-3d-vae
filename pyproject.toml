
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-3d-vae"
version = "0.1.0"
description = "Completing incomplete 3D tooth scans with a beta-VAE on point clouds"
license = "MIT"
authors = [{ name = "Dylan Gelbier" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "numpy",
    "pandas",
    "pillow",
    "scikit-learn",
    "scipy",
    "torch",
    "trimesh>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
